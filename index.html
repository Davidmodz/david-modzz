    <a

      target="_blank"
      onclick="activarTelegram()">
      ✈️ Seguir en Telegram
    </a>

    <!-- CONTINUAR -->
    <button
      id="btnContinuar"
      class="boton continuar"
      onclick="iniciarCarga()"
      disabled>
      🔒 Completa WhatsApp y Telegram
    </button>

    <div id="mensaje" class="mensaje">
      ⏳ Preparando tu archivo...<br><br>
      Espera unos segundos...

    <!-- ARCHIVO -->
    <div id="archivo" class="archivo">

  <script>
    let whatsapp = false;
    let telegram = false;

    function activarWhatsApp() {
      whatsapp = true;
      comprobar();
    }

    function activarTelegram() {
      telegram = true;
      comprobar();
    }

    function comprobar() {
      if (whatsapp && telegram) {
        const boton = document.getElementById("btnContinuar");

        boton.disabled = false;
        boton.classList.add("activo");
        boton.innerHTML = "🔓 CONTINUAR";
      }
    }

    function iniciarCarga() {
      const boton = document.getElementById("btnContinuar");
      const mensaje = document.getElementById("mensaje");
      const archivo = document.getElementById("archivo");

      boton.disabled = true;
      boton.innerHTML = "⏳ PREPARANDO...";
      mensaje.style.display = "block";

      setTimeout(function() {
        mensaje.style.display = "none";
        archivo.style.display = "block";
        boton.innerHTML = "✅ ARCHIVO LISTO";

        archivo.scrollIntoView({
          behavior: "smooth"
        });
      }, 5000);
    }
  </script>
