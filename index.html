<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>David Mods</title>

  <!-- ID de tu cuenta AdSense -->
  <meta name="google-adsense-account"
        content="ca-pub-9907836812347979">

  <!-- Google AdSense / Auto Ads -->
  <script async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9907836812347979"
    crossorigin="anonymous">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    .contenedor {
      max-width: 450px;
      margin: auto;
      padding: 35px 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    p {
      color: #d1d5db;
    }

    .boton {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      margin: 15px 0;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }

    .whatsapp {
      background: #25D366;
    }

    .telegram {
      background: #229ED9;
    }

    .continuar {
      background: #6b7280;
    }

    .continuar.activo {
      background: #7c3aed;
    }

    .anuncio {
      margin: 25px 0;
      min-height: 100px;
    }

    .pagina-anuncio {
      display: none;
    }

    .caja {
      margin-top: 25px;
      padding: 20px;
      background: #1f2937;
      border-radius: 15px;
      border: 1px solid #374151;
    }

    #archivo {
      display: none;
    }

    .archivo {
      display: block;
      margin-top: 15px;
      padding: 14px;
      background: #22c55e;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

    .contador {
      margin: 20px 0;
      font-size: 18px;
      color: #d1d5db;
    }
  </style>
</head>

<body>

<div class="contenedor">

  <h1>🔥 David Mods</h1>
  <p>Sigue nuestros canales para continuar.</p>

  <!-- WHATSAPP -->
  <a
    class="boton whatsapp"
    href="https://whatsapp.com/channel/0029VbDFfPV3rZZlfhalcL0O"
    target="_blank"
    onclick="activarWhatsApp()">
    🟢 Seguir en WhatsApp
  </a>

  <!-- TELEGRAM -->
  <a
    class="boton telegram"
    href="https://t.me/+OuKbyjCEv74xOGYx"
    target="_blank"
    onclick="activarTelegram()">
    ✈️ Seguir en Telegram
  </a>

  <!-- CONTINUAR INICIAL -->
  <button
    id="btnInicial"
    class="boton continuar"
    onclick="iniciarAnuncios()"
    disabled>
    🔒 Completa WhatsApp y Telegram
  </button>

  <!-- ========================= -->
  <!-- PÁGINA DE ANUNCIOS -->
  <!-- ========================= -->

  <div id="paginaAnuncio" class="pagina-anuncio">

    <div class="caja">

      <h2 id="tituloAnuncio">
        📢 Anuncio 1 de 5
      </h2>

      <p>
        El anuncio se está mostrando.
      </p>

      <!-- ADSENSE REAL -->
      <div class="anuncio">

        <ins class="adsbygoogle"
          style="display:block"
          data-ad-client="ca-pub-9907836812347979"
          data-ad-format="auto"
          data-full-width-responsive="true">
        </ins>

      </div>

      <div
        id="contador"
        class="contador">
        ⏳ Espera 15 segundos...
      </div>

      <button
        id="btnSiguiente"
        class="boton continuar activo"
        style="display:none"
        onclick="siguienteAnuncio()">
        ▶️ CONTINUAR
      </button>

    </div>

  </div>

  <!-- ========================= -->
  <!-- ARCHIVO FINAL -->
  <!-- ========================= -->

  <div
    id="archivo"
    class="caja">

    <h2>📦 Archivo disponible</h2>

    <p>
      Tu archivo ya está listo.
    </p>

    <a
      class="archivo"
      href="https://www.mediafire.com/file/544lpjhtvvxl2te/GHOST+MOD+V26,.apk/file"
      target="_blank">
      📥 Descargar archivo
    </a>

  </div>

</div>

<script>

let whatsapp = false;
let telegram = false;
let anuncioActual = 0;
let intervalo;

function activarWhatsApp() {
  whatsapp = true;
  comprobar();
}

function activarTelegram() {
  telegram = true;
  comprobar();
}

function comprobar() {

  if (whatsapp && telegram) {

    const boton =
      document.getElementById("btnInicial");

    boton.disabled = false;

    boton.classList.add("activo");

    boton.innerHTML =
      "▶️ CONTINUAR";

  }
}

function iniciarAnuncios() {

  document.getElementById("btnInicial")
    .style.display = "none";

  document.getElementById("paginaAnuncio")
    .style.display = "block";

  anuncioActual = 1;

  mostrarAnuncio();

}

function mostrarAnuncio() {

  document.getElementById("tituloAnuncio")
    .innerHTML =
    "📢 Anuncio " +
    anuncioActual +
    " de 5";

  const contador =
    document.getElementById("contador");

  const boton =
    document.getElementById("btnSiguiente");

  boton.style.display = "none";

  let segundos = 15;

  contador.innerHTML =
    "⏳ Espera " +
    segundos +
    " segundos...";

  clearInterval(intervalo);

  /*
    Carga un bloque nuevo de AdSense.
    Google decide qué anuncio mostrar.
  */

  const contenedor =
    document.querySelector(".anuncio");

  contenedor.innerHTML = `
    <ins class="adsbygoogle"
      style="display:block"
      data-ad-client="ca-pub-9907836812347979"
      data-ad-format="auto"
      data-full-width-responsive="true">
    </ins>
  `;

  try {
    (adsbygoogle =
      window.adsbygoogle || []).push({});
  } catch(e) {
    console.log("AdSense todavía no disponible.");
  }

  intervalo = setInterval(function() {

    segundos--;

    contador.innerHTML =
      "⏳ Espera " +
      segundos +
      " segundos...";

    if (segundos <= 0) {

      clearInterval(intervalo);

      contador.innerHTML =
        "✅ Puedes continuar";

      boton.style.display =
        "block";

    }

  }, 1000);

}

function siguienteAnuncio() {

  if (anuncioActual < 5) {

    anuncioActual++;

    mostrarAnuncio();

  } else {

    document.getElementById("paginaAnuncio")
      .style.display = "none";

    document.getElementById("archivo")
      .style.display = "block";

  }

}

</script>

</body>
</html>
