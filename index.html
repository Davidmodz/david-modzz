<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>David Mods</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    .contenedor {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin-top: 20px;
    }

    .anuncio {
      background: #222;
      border: 1px solid #444;
      min-height: 90px;
      margin: 15px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #aaa;
    }

    .boton {
      display: block;
      padding: 15px;
      margin: 15px 0;
      border-radius: 10px;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .whatsapp {
      background: #25D366;
    }

    .telegram {
      background: #229ED9;
    }

    #continuar {
      background: #555;
      cursor: not-allowed;
      border: none;
      width: 100%;
      font-size: 16px;
    }

    #continuar.activo {
      background: #e53935;
      cursor: pointer;
    }

    #archivo {
      display: none;
      margin-top: 25px;
      padding: 20px;
      background: #1d1d1d;
      border-radius: 12px;
      border: 1px solid #444;
    }

    .descargar {
      display: inline-block;
      background: #00c853;
      color: white;
      text-decoration: none;
      padding: 15px 30px;
      border-radius: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="contenedor">

  <h1>🔥 David Mods</h1>
  <p>Sigue los canales para desbloquear el archivo.</p>

  <!-- ANUNCIO 1 -->
  <div class="anuncio">
    ANUNCIO
  </div>

  <!-- WHATSAPP -->
  <a
    class="boton whatsapp"
    href="https://whatsapp.com/channel/0029VbDFfPV3rZZlfhalcL0O"
    target="_blank"
    onclick="seguirWhatsApp()">
    📱 Seguir WhatsApp
  </a>

  <!-- TELEGRAM -->
  <a
    class="boton telegram"
    href="https://t.me/+OuKbyjCEv74xOGYx"
    target="_blank"
    onclick="seguirTelegram()">
    ✈️ Seguir Telegram
  </a>

  <!-- ANUNCIO 2 -->
  <div class="anuncio">
    ANUNCIO
  </div>

  <button id="continuar" class="boton" onclick="mostrarArchivo()" disabled>
    🔒 CONTINUAR
  </button>

  <!-- ARCHIVO -->
  <div id="archivo">
    <h2>📦 Archivo desbloqueado</h2>
    <p>Ya puedes descargar el archivo.</p>

    <a
      class="descargar"
      href="https://www.mediafire.com/file/d79yr1mm3dd5y0y/Proxy_Mth_Team_v22.zip/file"
      target="_blank">
      ⬇️ DESCARGAR
    </a>
  </div>

</div>

<script>
  let whatsapp = false;
  let telegram = false;

  function seguirWhatsApp() {
    whatsapp = true;
    comprobar();
  }

  function seguirTelegram() {
    telegram = true;
    comprobar();
  }

  function comprobar() {
    if (whatsapp && telegram) {
      const boton = document.getElementById("continuar");

      boton.disabled = false;
      boton.classList.add("activo");
      boton.innerHTML = "✅ CONTINUAR";
    }
  }

  function mostrarArchivo() {
    if (whatsapp && telegram) {
      document.getElementById("archivo").style.display = "block";
      document.getElementById("archivo").scrollIntoView({
        behavior: "smooth"
      });
    }
  }
</script>

</body>
</html>
