      href="https://whatsapp.com/channel/0029VbDFfPV3rZZlfhalcL0O"
      target="_blank"
      onclick="activarWhatsApp()">
      🟢 Seguir en WhatsApp
    </a>

    <!-- TELEGRAM -->
    <a
      class="boton telegram"
      href="https://t.me/+OuKbyjCEv74xOGYx"
      target="_blank"
      onclick="activarTelegram()">
      ✈️ Seguir en Telegram
    </a>

    <!-- CONTINUAR -->
    <button
      id="btnContinuar"
      class="boton continuar"
      onclick="iniciarCarga()"
      disabled>
      🔒 Completa WhatsApp y Telegram
    </button>

    <!-- CARGANDO -->
    <div id="cargando" class="cargando">
      <div class="spinner"></div>

      <p>⏳ Preparando tu archivo...</p>

      <div id="contador">
        Espera 5 segundos...
      </div>
    </div>

    <!-- ARCHIVO -->
    <div id="archivo" class="archivo">

      <h2>📦 Archivo desbloqueado</h2>

      <p>GHOST MOD V26</p>

      <a
        class="boton descargar"
        href="https://www.mediafire.com/file/544lpjhtvvxl2te/GHOST+MOD+V26,.apk/file"
        target="_blank">
        ⬇️ DESCARGAR GHOST MOD V26
      </a>

    </div>

  </div>

  <script>

    let whatsapp = false;
    let telegram = false;
    let iniciado = false;

    function activarWhatsApp() {
      whatsapp = true;
      comprobarPasos();
    }

    function activarTelegram() {
      telegram = true;
      comprobarPasos();
    }

    function comprobarPasos() {

      if (whatsapp && telegram) {

        const boton = document.getElementById("btnContinuar");

        boton.disabled = false;
        boton.innerHTML = "✅ CONTINUAR";

      }
    }

    function iniciarCarga() {

      if (iniciado) return;

      iniciado = true;

      const boton = document.getElementById("btnContinuar");
      const cargando = document.getElementById("cargando");
      const archivo = document.getElementById("archivo");
      const contador = document.getElementById("contador");

      boton.style.display = "none";
      cargando.style.display = "block";

      let segundos = 5;

      contador.innerHTML =
        "Espera " + segundos + " segundos...";

      const intervalo = setInterval(function() {

        segundos--;

        if (segundos > 0) {

          contador.innerHTML =
            "Espera " + segundos + " segundos...";

        } else {

          clearInterval(intervalo);

          cargando.style.display = "none";
          archivo.style.display = "block";

          window.scrollTo({
            top: document.body.scrollHeight,
            behavior: "smooth"
          });
        }

      }, 1000);
    }

  </script>

</body>
