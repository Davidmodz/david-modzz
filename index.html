<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>David Mods</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    .contenedor {
      max-width: 450px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    p {
      color: #d1d5db;
    }

    .boton {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      margin: 15px 0;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }

    .whatsapp {
      background: #25D366;
    }

    .telegram {
      background: #229ED9;
    }

    .continuar {
      background: #6b7280;
    }

    .continuar.activo {
      background: #7c3aed;
    }

    #cargando,
    #archivo {
      display: none;
    }

    .caja-archivo {
      margin-top: 25px;
      padding: 20px;
      background: #1f2937;
      border-radius: 15px;
      border: 1px solid #374151;
    }

    .archivo {
      display: block;
      margin-top: 15px;
      padding: 14px;
      background: #22c55e;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>🔥 David Mods</h1>
    <p>Sigue nuestros canales para continuar.</p>

    <!-- WHATSAPP -->
    <a
      class="boton whatsapp"
      href="https://whatsapp.com/channel/0029VbDFfPV3rZZlfhalcL0O"
      target="_blank"
      onclick="activarWhatsApp()">
      🟢 Seguir en WhatsApp
    </a>

    <!-- TELEGRAM -->
    <a
      class="boton telegram"
      href="https://t.me/+OuKbyjCEv74xOGYx"
      target="_blank"
      onclick="activarTelegram()">
      ✈️ Seguir en Telegram
    </a>

    <!-- CONTINUAR -->
    <button
      id="btnContinuar"
      class="boton continuar"
      onclick="mostrarArchivo()"
      disabled>
      🔒 Completa WhatsApp y Telegram
    </button>

    <!-- CARGANDO -->
    <div id="cargando">
      ⏳ Preparando archivo...
    </div>

    <!-- ARCHIVO -->
    <div id="archivo" class="caja-archivo">
      <h2>📦 Archivo disponible</h2>
      <p>Tu archivo ya está listo.</p>

      <a
        class="archivo"
        href="https://www.mediafire.com/file/544lpjhtvvxl2te/GHOST+MOD+V26,.apk/file"
        target="_blank">
        📥 Descargar archivo
      </a>
    </div>

  </div>

  <script>
    let whatsapp = false;
    let telegram = false;

    function activarWhatsApp() {
      whatsapp = true;
      comprobar();
    }

    function activarTelegram() {
      telegram = true;
      comprobar();
    }

    function comprobar() {
      if (whatsapp && telegram) {
        const boton = document.getElementById("btnContinuar");

        boton.disabled = false;
        boton.classList.add("activo");
        boton.innerHTML = "▶️ CONTINUAR";
      }
    }

    function mostrarArchivo() {
      const boton = document.getElementById("btnContinuar");
      const cargando = document.getElementById("cargando");
      const archivo = document.getElementById("archivo");

      boton.style.display = "none";
      cargando.style.display = "block";

      // Espera 1 segundo
      setTimeout(function() {
        cargando.style.display = "none";
        archivo.style.display = "block";
      }, 1000);
    }
  </script>

</body>
</html>
